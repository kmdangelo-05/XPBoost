  confirmed_deactivated_self_boosters_message: "&3Tutti i tuoi booster sono stati &4&lDISATTIVATI&f"
  expired_booster_message: "&cIl tuo booster &e%multiplier%x &cè scaduto!&f"
  help_command_message: |
    &8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━&r
    &6&l  ✦ XPBoost &8» &7Comandi disponibili
    &8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━&r
    &6✦ &a/xpboost add &e<moltiplicatore> <durata> &7[giocatore] [online_only]
      &f&oAggiunge un booster al cumulo. La durata accetta formati come &71h30m&f&o. Tempi accettati: &7w, d, h, m s&f&o
    &6✦ &a/xpboost remove &7[giocatore] <identificativo booster>
      &f&oApre la GUI per rimuovere un booster dalla coda. È possibile rimuovere i booster pure tramite comando con l'identificativo
    &6✦ &a/xpboost reset &7[confirm] [giocatore]
      &f&oAzzera tutti i booster. Richiede conferma con &econfirm&f&o.
    &6✦ &a/xpboost list &7[giocatore]
      &f&oMostra tutti i booster appartenenti al giocatore.
    &6✦ &a/xpboost preferences &7<action_bar&8|&7xp_chat_message&8|&7toggle_boosters> [true&8|&7false]
      &f&oConfigura le notifiche o attiva/disattiva tutti i tuoi booster; toggle_boosters non necessita di true/false.
    &8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━&r
    &7&o  &e<obbligatorio> &7[opzionale]     &r